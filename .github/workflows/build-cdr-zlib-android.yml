name: Build CDR zlib Android

on:
  workflow_dispatch:

jobs:
  build-zlib:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get Android NDK
        run: |
          echo "NDK: $ANDROID_NDK_HOME"
          test -d "$ANDROID_NDK_HOME"

      - name: Download zlib
        run: |
          git clone --depth 1 https://github.com/madler/zlib.git zlib

      - name: Build zlib for Android ARM64
        run: |
          mkdir -p zlib-android
          cd zlib-android

          cmake ../zlib \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/cdr-prefix"

          cmake --build . --parallel 2
          cmake --install .

      - name: Verify zlib
        run: |
          echo "Checking Android zlib..."
          find "$GITHUB_WORKSPACE/cdr-prefix" \
            -type f \( -name "libz.a" -o -name "libz.so" \) -print
