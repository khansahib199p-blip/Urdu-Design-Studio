name: Test CDR Android Native Build

on:
  workflow_dispatch:

jobs:
  test-android-native:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Android NDK
        run: |
          echo "ANDROID_NDK=$ANDROID_NDK"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++" --version

      - name: Configure Android native build
        run: |
          mkdir -p android-cdr-test

          cmake \
            -S app/src/main/cpp \
            -B android-cdr-test \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build Android native library
        run: |
          cmake --build android-cdr-test --parallel 2

      - name: Verify native library
        run: |
          find android-cdr-test -type f \
            \( -name "libuds_cdr.so" -o -name "*.so" \) -print
