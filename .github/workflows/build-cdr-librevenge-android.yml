name: Build CDR librevenge Android

on:
  workflow_dispatch:

jobs:
  build-librevenge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            automake \
            libtool \
            pkg-config

      - name: Download librevenge
        run: |
          git clone --depth 1 https://github.com/Distrotech/librevenge.git librevenge
      - name: Configure librevenge for Android
        run: |
          cd librevenge

          ./autogen.sh

          ./configure \
            --host=aarch64-linux-android \
            --prefix="$GITHUB_WORKSPACE/cdr-prefix" \
            --disable-tools \
            --disable-tests

      - name: Build librevenge
        run: |
          cd librevenge
          make -j2

      - name: Verify librevenge
        run: |
          find librevenge \
            -type f \( -name "librevenge*.a" -o -name "librevenge*.so" \) -print
