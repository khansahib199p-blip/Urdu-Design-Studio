name: Build CDR Native Engine

on:
  workflow_dispatch:

jobs:
  build-cdr:
    runs-on: ubuntu-latest

    steps:
      - name: Install CDR dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            autoconf \
            automake \
            libtool \
            pkg-config \
            libboost-dev \
            libicu-dev \
            liblcms2-dev \
            zlib1g-dev \
            librevenge-dev

      - name: Download libcdr
        run: |
          git clone --depth 1 https://github.com/LibreOffice/libcdr.git libcdr

      - name: Configure libcdr
        working-directory: libcdr
        run: |
          ./autogen.sh
          ./configure \
            --disable-tools \
            --disable-tests \
            --without-docs

      - name: Build libcdr
        working-directory: libcdr
        run: |
          make -j2

      - name: Verify libcdr
        working-directory: libcdr
        run: |
          find . -name "libcdr*.so*" -o -name "libcdr*.a"
