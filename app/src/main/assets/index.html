<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Urdu Design Studio</title>
<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#15152b,#302060);
color:white;
text-align:center;
}
.header{
padding:25px 15px;
font-size:28px;
font-weight:bold;
}
.subtitle{color:#ddd;margin-bottom:20px}
.tools{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;
padding:20px;
}
button{
border:0;
border-radius:18px;
padding:22px 10px;
font-size:19px;
font-weight:bold;
color:white;
background:linear-gradient(135deg,#7b4cff,#d43cff);
box-shadow:0 5px 15px #0005;
}
button:active{transform:scale(.96)}
.canvas{
margin:10px 20px;
height:220px;
border-radius:20px;
background:white;
color:#222;
display:flex;
align-items:center;
justify-content:center;
font-size:28px;
}
</style>
</head>
<body>

<div class="header">اردو ڈیزائن اسٹوڈیو</div>
<div class="subtitle">اپنا خوبصورت اردو ڈیزائن بنائیں</div>

<div class="canvas" id="canvas">یہاں ڈیزائن بنائیں</div>

<div class="tools">
<button onclick="addText()">📝 متن</button>
<button onclick="addShape()">⬜ شکل</button>
<button onclick="changeColor()">🎨 رنگ</button>
<button onclick="clearCanvas()">🗑 صاف کریں</button>
</div>

<script>
function addText(){
document.getElementById("canvas").innerHTML="نیا اردو متن";
}
function addShape(){
document.getElementById("canvas").innerHTML="◆";
}
function changeColor(){
document.getElementById("canvas").style.background=
"#"+Math.floor(Math.random()*16777215).toString(16);
}
function clearCanvas(){
document.getElementById("canvas").innerHTML="یہاں ڈیزائن بنائیں";
}
</script>

</body>
</html>
