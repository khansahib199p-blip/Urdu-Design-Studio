<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Urdu Design Studio</title>

<style>
*{box-sizing:border-box}

html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
font-family:Arial,"Noto Nastaliq Urdu","Noto Naskh Arabic",sans-serif;
background:#0b0d18;
color:#fff;
}

button,input,textarea,select{font-family:inherit}

.app{
height:100vh;
display:flex;
flex-direction:column;
background:
radial-gradient(circle at 50% -20%,#5e2aa0 0,#17152d 38%,#090b15 100%);
}

/* TOP BAR */

.topbar{
height:64px;
min-height:64px;
display:flex;
align-items:center;
justify-content:space-between;
padding:7px 10px;
background:rgba(30,20,55,.92);
border-bottom:1px solid #ffffff18;
box-shadow:0 5px 20px #0008;
}

.brand{
display:flex;
align-items:center;
gap:8px;
font-size:19px;
font-weight:800;
white-space:nowrap;
}

.brandIcon{
width:42px;
height:42px;
border-radius:13px;
display:flex;
align-items:center;
justify-content:center;
background:linear-gradient(135deg,#8d4dff,#d92cff);
box-shadow:0 5px 18px #922cff55;
font-size:23px;
}

.topTools{
display:flex;
gap:6px;
direction:ltr;
}

.topBtn{
width:43px;
height:43px;
border:1px solid #ffffff12;
border-radius:13px;
background:#ffffff0d;
color:#fff;
font-size:19px;
}

.topBtn:active{
transform:scale(.92);
background:#8b3dff;
}

/* WORK AREA */

.work{
flex:1;
display:flex;
min-height:0;
}

.side{
width:62px;
min-width:62px;
background:#121425;
border-left:1px solid #ffffff0c;
display:flex;
flex-direction:column;
align-items:center;
padding:8px 6px;
gap:7px;
}

.sideBtn{
width:49px;
height:49px;
border:1px solid #ffffff0d;
border-radius:15px;
background:#1e2136;
color:#fff;
font-size:20px;
}

.sideBtn.active{
background:linear-gradient(145deg,#743cff,#b72cff);
box-shadow:0 6px 18px #7c32ff55;
}

/* CANVAS */

.stage{
flex:1;
min-width:0;
position:relative;
overflow:auto;
display:flex;
align-items:center;
justify-content:center;
padding:18px;
}

.canvas{
position:relative;
width:340px;
height:500px;
flex:none;
background:#fff;
box-shadow:0 15px 45px #000b;
overflow:hidden;
border-radius:5px;
}

.grid{
position:absolute;
inset:0;
background-image:
linear-gradient(#00000008 1px,transparent 1px),
linear-gradient(90deg,#00000008 1px,transparent 1px);
background-size:20px 20px;
pointer-events:none;
}

.empty{
position:absolute;
inset:0;
display:flex;
align-items:center;
justify-content:center;
color:#aaa;
font-size:20px;
pointer-events:none;
}

/* OBJECT */

.obj{
position:absolute;
touch-action:none;
user-select:none;
cursor:move;
}

.obj.selected{
outline:2px solid #7c3cff;
outline-offset:3px;
}

.textObj{
padding:5px 10px;
min-width:60px;
min-height:40px;
font-size:30px;
color:#171717;
text-align:center;
direction:rtl;
white-space:pre-wrap;
line-height:1.35;
background:transparent;
}

.textObj:focus{
outline:2px solid #7c3cff;
}

.rect{
width:120px;
height:100px;
background:#a477ff44;
border:3px solid #713bff;
border-radius:12px;
}

.circle{
width:120px;
height:120px;
background:#ff5ca844;
border:3px solid #ff4e9b;
border-radius:50%;
}

.line{
width:160px;
height:5px;
background:#673bff;
border-radius:5px;
}

/* HANDLES */

.handle{
position:absolute;
width:17px;
height:17px;
border-radius:50%;
background:#7c3cff;
border:3px solid white;
box-shadow:0 2px 7px #0008;
z-index:20;
display:none;
}

.selected .handle{
display:block;
}

.resize{
right:-10px;
bottom:-10px;
cursor:nwse-resize;
}

.rotate{
left:50%;
top:-29px;
transform:translateX(-50%);
cursor:grab;
}

/* BOTTOM */

.bottom{
background:rgba(18,20,37,.98);
border-top:1px solid #ffffff12;
padding:8px;
}

.toolGrid{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:7px;
}

.tool{
height:62px;
border:1px solid #ffffff0c;
border-radius:16px;
background:linear-gradient(145deg,#24273e,#191b2e);
color:#fff;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
gap:3px;
font-size:12px;
box-shadow:0 4px 12px #0004;
}

.tool .ico{
font-size:22px;
line-height:22px;
}

.tool:active{
transform:scale(.94);
background:linear-gradient(145deg,#773dff,#b92cff);
}

/* PANEL */

.panel{
position:absolute;
left:8px;
right:8px;
bottom:8px;
z-index:50;
background:rgba(25,27,45,.98);
border:1px solid #ffffff18;
border-radius:20px;
padding:14px;
box-shadow:0 15px 45px #000c;
display:none;
max-height:310px;
overflow:auto;
}

.panel.show{
display:block;
}

.panelTitle{
font-size:17px;
font-weight:bold;
margin-bottom:10px;
display:flex;
justify-content:space-between;
}

.close{
border:0;
background:#ffffff12;
color:#fff;
border-radius:9px;
width:32px;
height:32px;
}

.row{
display:flex;
align-items:center;
gap:8px;
margin:8px 0;
}

.row label{
width:72px;
font-size:13px;
color:#ddd;
}

.row input[type="range"]{
flex:1;
accent-color:#9a4cff;
}

.color{
width:48px!important;
height:38px;
padding:2px;
border:0;
background:none;
}

select{
flex:1;
padding:9px;
border-radius:10px;
background:#10121f;
color:#fff;
border:1px solid #ffffff18;
}

.mini{
display:grid;
grid-template-columns:1fr 1fr;
gap:7px;
}

.mini button{
padding:9px;
border:0;
border-radius:10px;
background:#2b2e46;
color:#fff;
}

.modal{
position:fixed;
inset:0;
background:#000b;
z-index:100;
display:none;
align-items:center;
justify-content:center;
padding:20px;
}

.modal.show{
display:flex;
}

.modalBox{
width:100%;
max-width:390px;
background:#202338;
border:1px solid #ffffff18;
border-radius:22px;
padding:18px;
box-shadow:0 20px 60px #000;
}

.modalTitle{
font-size:19px;
font-weight:bold;
margin-bottom:12px;
}

.textArea{
width:100%;
min-height:100px;
resize:none;
background:#10121e;
border:1px solid #ffffff20;
border-radius:13px;
padding:12px;
color:#fff;
font-size:21px;
direction:rtl;
}

.modalBtns{
display:flex;
gap:8px;
margin-top:12px;
}

.modalBtns button{
flex:1;
padding:12px;
border:0;
border-radius:12px;
color:#fff;
background:#35384f;
}

.modalBtns .ok{
background:linear-gradient(135deg,#753cff,#bd2cff);
}

/* SMALL SCREEN */

@media(max-width:500px){
.brand{font-size:16px}
.side{display:none}
.stage{padding:12px}
.canvas{width:330px;height:480px}
.tool{height:58px}
}
</style>
</head>

<body>

<div class="app">

<!-- TOP -->

<div class="topbar">

<div class="brand">
<div class="brandIcon">🎨</div>
<div>اردو ڈیزائن اسٹوڈیو</div>
</div>

<div class="topTools">
<button class="topBtn" onclick="undo()">↶</button>
<button class="topBtn" onclick="redo()">↷</button>
<button class="topBtn" onclick="saveDesign()">💾</button>
</div>

</div>

<!-- WORK -->

<div class="work">

<div class="side">

<button class="sideBtn active" onclick="openTools()">🛠️</button>
<button class="sideBtn" onclick="togglePanel()">⚙️</button>
<button class="sideBtn" onclick="deleteSelected()">🗑️</button>

</div>

<div class="stage">

<div class="canvas" id="canvas">

<div class="grid"></div>

<div class="empty" id="empty">
اپنا ڈیزائن یہاں بنائیں
</div>

</div>

<!-- EDIT PANEL -->

<div class="panel" id="panel">

<div class="panelTitle">
<span>✦ آبجیکٹ کی ترمیم</span>
<button class="close" onclick="togglePanel()">×</button>
</div>

<div class="row">
<label>رنگ</label>
<input class="color" id="color" type="color" value="#713bff">
</div>

<div class="row">
<label>سائز</label>
<input id="size" type="range" min="10" max="100" value="30">
<span id="sizeVal">30</span>
</div>

<div class="row">
<label>فونٹ</label>
<select id="font">
<option>Arial</option>
<option>Noto Nastaliq Urdu</option>
<option>Noto Naskh Arabic</option>
<option>serif</option>
<option>sans-serif</option>
</select>
</div>

<div class="row">
<label>موٹائی</label>
<select id="weight">
<option value="400">Normal</option>
<option value="600">Semi Bold</option>
<option value="700">Bold</option>
</select>
</div>

<div class="row">
<label>گولائی</label>
<input id="radius" type="range" min="0" max="100" value="0">
<span id="radiusVal">0</span>
</div>

<div class="mini">
<button onclick="duplicate()">📋 کاپی</button>
<button onclick="deleteSelected()">🗑 حذف</button>
<button onclick="front()">⬆️ اوپر</button>
<button onclick="back()">⬇️ نیچے</button>
</div>

</div>

</div>

</div>

<!-- TOOLS -->

<div class="bottom">

<div class="toolGrid">

<button class="tool" onclick="addText()">
<span class="ico">📝</span>
متن
</button>

<button class="tool" onclick="addRect()">
<span class="ico">▣</span>
مربع
</button>

<button class="tool" onclick="addCircle()">
<span class="ico">●</span>
دائرہ
</button>

<button class="tool" onclick="addLine()">
<span class="ico">━</span>
لائن
</button>

<button class="tool" onclick="pickImage()">
<span class="ico">▧</span>
تصویر
</button>

<button class="tool" onclick="togglePanel()">
<span class="ico">⚙</span>
ترمیم
</button>

<button class="tool" onclick="duplicate()">
<span class="ico">⧉</span>
کاپی
</button>

<button class="tool" onclick="deleteSelected()">
<span class="ico">⌫</span>
حذف
</button>

<button class="tool" onclick="front()">
<span class="ico">↑</span>
اوپر
</button>

<button class="tool" onclick="back()">
<span class="ico">↓</span>
نیچے
</button>

</div>

</div>

</div>

<input id="imageInput" type="file" accept="image/*" hidden>

<!-- TEXT MODAL -->

<div class="modal" id="textModal">

<div class="modalBox">

<div class="modalTitle">
📝 نیا اردو متن
</div>

<textarea
id="newText"
class="textArea"
placeholder="اپنا اردو متن یہاں لکھیں..."
></textarea>

<div class="modalBtns">

<button onclick="closeText()">منسوخ</button>

<button class="ok" onclick="createText()">شامل کریں</button>

</div>

</div>

</div>

<script>

/* =====================
   BASIC
===================== */

const canvas=document.getElementById("canvas");
const panel=document.getElementById("panel");
const empty=document.getElementById("empty");

let selected=null;
let history=[];
let historyPos=-1;

function updateEmpty(){

let objs=canvas.querySelectorAll(".obj");

empty.style.display=objs.length?"none":"flex";

}


/* =====================
   HISTORY
===================== */

function snapshot(){

let html=canvas.innerHTML;

history=history.slice(0,historyPos+1);

history.push(html);

historyPos++;

if(history.length>30){
history.shift();
historyPos--;
}

}

function restore(html){

canvas.innerHTML=html;

selected=null;

canvas.querySelectorAll(".obj").forEach(o=>{
setupObject(o);
});

updateEmpty();

panel.classList.remove("show");

}

function undo(){

if(historyPos<=0)return;

historyPos--;

restore(history[historyPos]);

}

function redo(){

if(historyPos>=history.length-1)return;

historyPos++;

restore(history[historyPos]);

}


/* =====================
   SELECT
===================== */

function selectObject(o){

canvas.querySelectorAll(".obj")
.forEach(x=>x.classList.remove("selected"));

selected=o;

if(o){

o.classList.add("selected");

updatePanel();

}

}


/* =====================
   OBJECT CREATION
===================== */

function baseObject(cls){

const o=document.createElement("div");

o.className="obj "+cls;

o.style.left="105px";
o.style.top="170px";

canvas.appendChild(o);

setupObject(o);

selectObject(o);

updateEmpty();

snapshot();

return o;

}
