<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Urdu Design Studio</title>
<style>
:root{--p:#6c3df4;--p2:#9b6cff;--bg:#f6f5fa;--card:#fff;--text:#202124;--muted:#777b85}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}
button,input,select{font:inherit}button{border:0;cursor:pointer}.hidden{display:none!important}
#home{min-height:100vh;padding-bottom:75px}
.top{padding:18px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:22px;font-weight:900}.tag{font-size:12px;color:var(--muted);margin-top:3px}
.iconbtn{width:44px;height:44px;border-radius:14px;background:#fff;box-shadow:0 5px 18px #30206014}
.hero{margin:10px 16px;padding:22px;border-radius:25px;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;box-shadow:0 12px 28px #6c3df433}
.hero h1{margin:0 0 8px;font-size:27px}.hero p{margin:0 0 18px;opacity:.92}.primary{background:#fff;color:var(--p);padding:13px 18px;border-radius:15px;font-weight:800}
.section{padding:0 16px}.title{font-size:19px;font-weight:900;margin:21px 0 12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.card{background:var(--card);border-radius:18px;padding:14px 8px;min-height:100px;box-shadow:0 5px 20px #3020600d;text-align:center}.card .ico{font-size:26px;margin-bottom:8px}.card b{font-size:12px}
.recent{display:flex;gap:10px;overflow:auto}.recent .card{min-width:145px}
.bottom{position:fixed;bottom:0;left:0;right:0;height:67px;background:#fff;display:flex;justify-content:space-around;align-items:center;box-shadow:0 -5px 22px #30206012;z-index:50}.bottom button{background:none;color:var(--muted);font-size:11px;font-weight:700}.bottom .active{color:var(--p)}
#editor{height:100vh;background:#15151a;color:#fff;display:flex;flex-direction:column}
.editorTop{height:58px;display:flex;align-items:center;gap:7px;padding:8px 10px;background:#202126}.editorTop button{background:#303138;color:#fff;border-radius:10px;padding:9px 11px}.spacer{flex:1}
.stage{flex:1;overflow:auto;display:flex;justify-content:center;align-items:center;padding:18px;background:#111216}
.canvas{position:relative;width:340px;height:500px;background:#fff;overflow:hidden;box-shadow:0 12px 40px #0008;flex:none}
.obj{position:absolute;touch-action:none;user-select:none}.textObj{min-width:50px;padding:3px;color:#111;white-space:pre-wrap}.rect{width:120px;height:90px;border-radius:0;background:#6c3df4}.circle{width:100px;height:100px;border-radius:50%;background:#ff6680}.line{height:4px;width:140px;background:#222}.selected{outline:2px dashed #6c3df4;outline-offset:3px}
.toolbar{background:#202126;padding:9px;display:flex;gap:8px;overflow:auto}.tool{min-width:62px;background:#303138;color:#fff;border-radius:12px;padding:9px 7px;font-size:11px}
.panel{background:#24252b;padding:9px;display:flex;gap:7px;overflow:auto}.panel input,.panel select{background:#34353d;color:#fff;border:0;border-radius:9px;padding:8px;min-width:74px}
.modal{position:fixed;inset:0;background:#0009;display:flex;align-items:flex-end;z-index:100}.sheet{background:#fff;color:#222;width:100%;border-radius:24px 24px 0 0;padding:20px;max-height:82vh;overflow:auto}
.sheet h2{margin-top:0}.field{margin:12px 0}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:6px}.field input{width:100%;padding:12px;border:1px solid #ddd;border-radius:12px}
.actions{display:flex;gap:9px}.actions button{flex:1;padding:13px;border-radius:13px;font-weight:800}.ok{background:var(--p);color:#fff}.cancel{background:#eee}
#toast{position:fixed;left:50%;bottom:82px;transform:translateX(-50%);background:#222;color:#fff;padding:11px 16px;border-radius:12px;display:none;z-index:200;font-size:13px}
</style>
</head>
<body>

<section id="home">
<div class="top"><div><div class="brand">Urdu Design Studio</div><div class="tag">Design • Edit • Create</div></div><button class="iconbtn" id="settingsBtn">⚙️</button></div>
<div class="hero"><h1>Create beautiful designs</h1><p>Make Urdu designing easy, creative and professional.</p><button class="primary" id="newBtn">＋ New Design</button></div>
<div class="section">
<div class="title">Quick Access</div>
<div class="grid">
<button class="card" id="qaNew"><div class="ico">＋</div><b>New Design</b></button>
<button class="card" id="qaProjects"><div class="ico">📁</div><b>My Designs</b></button>
<button class="card" id="qaTemplates"><div class="ico">🖼️</div><b>Templates</b></button>
<button class="card" id="qaElements"><div class="ico">✨</div><b>Design Elements</b></button>
<button class="card" id="qaShapes"><div class="ico">⬡</div><b>Shapes</b></button>
<button class="card" id="qaImage"><div class="ico">📷</div><b>Import Image</b></button>
</div>
<div class="title">Design Tools</div>
<div class="grid">
<button class="card" id="homeText"><div class="ico">T</div><b>Text</b></button>
<button class="card" id="homeShape"><div class="ico">▣</div><b>Shape</b></button>
<button class="card" id="homeCircle"><div class="ico">●</div><b>Circle</b></button>
<button class="card" id="homeLine"><div class="ico">╱</div><b>Line</b></button>
<button class="card" id="homeBg"><div class="ico">🎨</div><b>Backgrounds</b></button>
<button class="card" id="homeCdr"><div class="ico">CDR</div><b>Open CDR</b></button>
</div>
<div class="title">Recent Designs</div><div class="recent" id="recent"><div class="card"><div class="ico">📄</div><b>No saved designs yet</b></div></div>
</div>
<div class="bottom">
<button class="active">⌂<br>Home</button><button id="navProjects">▣<br>Projects</button><button id="navCreate">＋<br>Create</button><button id="navTemplates">◈<br>Templates</button><button id="navSettings">⚙<br>Settings</button>
</div>
</section>

<section id="editor" class="hidden">
<div class="editorTop"><button id="backBtn">‹</button><b>Urdu Design Studio</b><div class="spacer"></div><button id="undoBtn">↶</button><button id="redoBtn">↷</button><button id="saveBtn">💾</button></div>
<div class="stage"><div id="canvas" class="canvas"></div></div>
<div id="panel" class="panel hidden"></div>
<div class="toolbar">
<button class="tool" id="tText">Text</button><button class="tool" id="tShape">Shape</button><button class="tool" id="tCircle">Circle</button><button class="tool" id="tLine">Line</button><button class="tool" id="tImage">Image</button><button class="tool" id="tDuplicate">Duplicate</button><button class="tool" id="tDelete">Delete</button><button class="tool" id="tProperties">Properties</button><button class="tool" id="tExport">Export</button>
</div>
</section>

<input id="fileInput" type="file" accept="image/png,image/jpeg,image/webp" class="hidden">
<div id="modal" class="modal hidden"><div class="sheet" id="sheet"></div></div><div id="toast"></div>

<script>
(function(){
"use strict";
var home=document.getElementById("home"),editor=document.getElementById("editor"),canvas=document.getElementById("canvas"),panel=document.getElementById("panel"),modal=document.getElementById("modal"),sheet=document.getElementById("sheet"),fileInput=document.getElementById("fileInput");
var selected=null,undoStack=[],redoStack=[];

function toast(t){var x=document.getElementById("toast");x.textContent=t;x.style.display="block";clearTimeout(window.__udsToast);window.__udsToast=setTimeout(function(){x.style.display="none"},1800)}
function openModal(s){sheet.innerHTML=s;modal.classList.remove("hidden")}
function closeModal(){modal.classList.add("hidden")}
function snapshot(){undoStack.push(canvas.innerHTML);if(undoStack.length>40)undoStack.shift();redoStack=[]}
function restore(s){canvas.innerHTML=s;selected=null;bindObjects();showProperties()}
function undo(){if(!undoStack.length)return;redoStack.push(canvas.innerHTML);restore(undoStack.pop())}
function redo(){if(!redoStack.length)return;undoStack.push(canvas.innerHTML);restore(redoStack.pop())}

function select(o){if(selected)selected.classList.remove("selected");selected=o;if(o)o.classList.add("selected");showProperties()}
function bindObjects(){
var list=canvas.querySelectorAll(".obj");
list.forEach(function(o){
o.onpointerdown=function(e){e.stopPropagation();select(o);o.__sx=e.clientX;o.__sy=e.clientY;o.__ox=parseFloat(o.style.left)||20;o.__oy=parseFloat(o.style.top)||20;o.setPointerCapture(e.pointerId)};
o.onpointermove=function(e){if(!o.hasPointerCapture(e.pointerId))return;o.style.left=(o.__ox+e.clientX-o.__sx)+"px";o.style.top=(o.__oy+e.clientY-o.__sy)+"px"};
o.onpointerup=function(e){if(o.hasPointerCapture(e.pointerId))o.releasePointerCapture(e.pointerId);snapshot()};
});
}
canvas.onclick=function(){select(null)};

function make(cls,text){
snapshot();var o=document.createElement("div");o.className="obj "+cls;o.style.left="40px";o.style.top="50px";if(text)o.textContent=text;canvas.appendChild(o);select(o);bindObjects();return o
}
function addText(){if(editor.classList.contains("hidden"))return newDesign();var o=make("textObj","Your Text");o.style.fontSize="32px";o.style.fontWeight="700";showProperties()}
function addRect(){if(editor.classList.contains("hidden"))return newDesign();var o=make("rect");o.style.background="#6c3df4";showProperties()}
function addCircle(){if(editor.classList.contains("hidden"))return newDesign();var o=make("circle");o.style.background="#ff6680";showProperties()}
function addLine(){if(editor.classList.contains("hidden"))return newDesign();make("line");showProperties()}
function duplicate(){if(!selected)return toast("Select an object first");snapshot();var n=selected.cloneNode(true);n.style.left=((parseFloat(selected.style.left)||0)+20)+"px";n.style.top=((parseFloat(selected.style.top)||0)+20)+"px";n.classList.remove("selected");canvas.appendChild(n);select(n);bindObjects()}
function del(){if(!selected)return;snapshot();selected.remove();selected=null;showProperties()}
function showProperties(){
if(!selected){panel.classList.add("hidden");return}
panel.classList.remove("hidden");
if(selected.classList.contains("textObj")){
panel.innerHTML='<input id="pText"><input id="pSize" type="number"><input id="pColor" type="color"><select id="pWeight"><option value="400">Normal</option><option value="700">Bold</option><option value="900">Heavy</option></select>';
document.getElementById("pText").value=selected.textContent;
document.getElementById("pSize").value=parseInt(selected.style.fontSize)||32;
document.getElementById("pColor").value=toHex(selected.style.color)||"#111111";
document.getElementById("pWeight").value=selected.style.fontWeight||"400";
document.getElementById("pText").oninput=function(){selected.textContent=this.value};
document.getElementById("pSize").oninput=function(){selected.style.fontSize=this.value+"px"};
document.getElementById("pColor").oninput=function(){selected.style.color=this.value};
document.getElementById("pWeight").onchange=function(){selected.style.fontWeight=this.value};
}else{
panel.innerHTML='<input id="pColor" type="color"><input id="pRadius" type="number" min="0" max="200"><button class="tool" id="pFront">Bring Front</button>';
document.getElementById("pColor").value=toHex(selected.style.backgroundColor||"#6c3df4")||"#6c3df4";
document.getElementById("pRadius").value=parseInt(selected.style.borderRadius)||0;
document.getElementById("pColor").oninput=function(){selected.style.background=this.value};
document.getElementById("pRadius").oninput=function(){selected.style.borderRadius=this.value+"px"};
document.getElementById("pFront").onclick=function(){canvas.appendChild(selected)};
}
}
function toHex(c){if(!c)return"#111111";var m=c.match(/\d+/g);if(!m||m.length<3)return c;return"#"+m.slice(0,3).map(function(v){return(+v).toString(16).padStart(2,"0")}).join("")}

function newDesign(){
openModal('<h2>New Design</h2><div class="field"><label>Canvas Width</label><input id="nw" type="number" value="1080"></div><div class="field"><label>Canvas Height</label><input id="nh" type="number" value="1080"></div><div class="grid"><button class="card" id="sq">Square</button><button class="card" id="po">Portrait</button><button class="card" id="la">Landscape</button></div><div class="actions"><button class="cancel" id="cancelNew">Cancel</button><button class="ok" id="createDesign">Create Design</button></div>');
document.getElementById("sq").onclick=function(){nw.value=1080;nh.value=1080};document.getElementById("po").onclick=function(){nw.value=1080;nh.value=1350};document.getElementById("la").onclick=function(){nw.value=1920;nh.value=1080};document.getElementById("cancelNew").onclick=closeModal;
document.getElementById("createDesign").onclick=function(){var w=parseInt(nw.value)||1080,h=parseInt(nh.value)||1080;canvas.dataset.width=w;canvas.dataset.height=h;canvas.style.width=Math.min(900,Math.max(240,w/2))+"px";canvas.style.height=Math.min(1100,Math.max(300,h/2))+"px";canvas.innerHTML="";undoStack=[];redoStack=[];closeModal();home.classList.add("hidden");editor.classList.remove("hidden");toast("New design created")};
}
function importImage(){if(editor.classList.contains("hidden"))return toast("Create a design first");fileInput.click()}
fileInput.onchange=function(){var f=fileInput.files[0];if(!f)return;var r=new FileReader();r.onload=function(){snapshot();var o=document.createElement("img");o.className="obj";o.src=r.result;o.style.left="30px";o.style.top="30px";o.style.width="220px";canvas.appendChild(o);select(o);bindObjects()};r.readAsDataURL(f)}
function saveProject(){var data={width:canvas.dataset.width||1080,height:canvas.dataset.height||1080,html:canvas.innerHTML};localStorage.setItem("UDS_LAST_PROJECT",JSON.stringify(data));refreshRecent();toast("Project saved")}
function refreshRecent(){if(localStorage.getItem("UDS_LAST_PROJECT"))document.getElementById("recent").innerHTML='<div class="card"><div class="ico">💾</div><b>Saved project available</b></div>'}
function openProjects(){toast("Projects are saved offline on this device")}
function templates(){openModal('<h2>Templates</h2><div class="grid"><button class="card" data-template="Business">Business</button><button class="card" data-template="Wedding">Wedding</button><button class="card" data-template="Sports">Sports</button><button class="card" data-template="Islamic">Islamic</button><button class="card" data-template="YouTube">YouTube</button><button class="card" data-template="Birthday">Birthday</button></div><br><button class="ok" style="width:100%" id="closeTemplates">Close</button>');document.querySelectorAll("[data-template]").forEach(function(b){b.onclick=function(){makeTemplate(b.getAttribute("data-template"))}});document.getElementById("closeTemplates").onclick=closeModal}
function makeTemplate(name){closeModal();if(editor.classList.contains("hidden")){newDesign();setTimeout(function(){makeTemplate(name)},80);return}snapshot();canvas.innerHTML="";var t=make("textObj",name+" Design");t.style.fontSize="44px";t.style.fontWeight="900";t.style.color="#6c3df4";t.style.left="45px";t.style.top="50px";var r=make("rect");r.style.left="30px";r.style.top="130px";r.style.width="280px";r.style.height="170px";r.style.background="linear-gradient(135deg,#6c3df4,#9b6cff)";toast(name+" template created")}
function settings(){openModal('<h2>Settings</h2><p>Urdu Design Studio</p><p class="tag">Offline-first mobile design editor</p><div class="actions"><button class="cancel" id="closeSettings">Close</button></div>');document.getElementById("closeSettings").onclick=closeModal}
function homePage(){editor.classList.add("hidden");home.classList.remove("hidden");panel.classList.add("hidden")}
function exportPNG(){toast("PNG export engine is prepared for the next export module phase")}
function cdr(){toast("CDR import engine is reserved for the CDR module phase")}

document.getElementById("newBtn").onclick=newDesign;document.getElementById("qaNew").onclick=newDesign;document.getElementById("qaProjects").onclick=openProjects;document.getElementById("qaTemplates").onclick=templates;document.getElementById("qaElements").onclick=function(){toast("Design Elements library ready for asset expansion")};document.getElementById("qaShapes").onclick=addRect;document.getElementById("qaImage").onclick=importImage;
document.getElementById("homeText").onclick=addText;document.getElementById("homeShape").onclick=addRect;document.getElementById("homeCircle").onclick=addCircle;document.getElementById("homeLine").onclick=addLine;document.getElementById("homeBg").onclick=templates;document.getElementById("homeCdr").onclick=cdr;
document.getElementById("settingsBtn").onclick=settings;document.getElementById("navProjects").onclick=openProjects;document.getElementById("navCreate").onclick=newDesign;document.getElementById("navTemplates").onclick=templates;document.getElementById("navSettings").onclick=settings;
document.getElementById("backBtn").onclick=homePage;document.getElementById("undoBtn").onclick=undo;document.getElementById("redoBtn").onclick=redo;document.getElementById("saveBtn").onclick=saveProject;
document.getElementById("tText").onclick=addText;document.getElementById("tShape").onclick=addRect;document.getElementById("tCircle").onclick=addCircle;document.getElementById("tLine").onclick=addLine;document.getElementById("tImage").onclick=importImage;document.getElementById("tDuplicate").onclick=duplicate;document.getElementById("tDelete").onclick=del;document.getElementById("tProperties").onclick=showProperties;document.getElementById("tExport").onclick=exportPNG;
modal.onclick=function(e){if(e.target===modal)closeModal()};
bindObjects();refreshRecent();
})();
</script>
</body>
</html>
