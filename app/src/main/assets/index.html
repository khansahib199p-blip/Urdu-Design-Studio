<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Urdu Design Studio</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:100%;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033;overflow:hidden}
button,input,select{font:inherit}
button{border:0;cursor:pointer}
.hidden{display:none!important}
.screen{width:100%;height:100%;overflow:hidden}
#home{display:flex;flex-direction:column;background:#f7f8fc;overflow:auto}
.topbar{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:#fff;border-bottom:1px solid #e7eaf0;flex-shrink:0}
.brand{font-size:20px;font-weight:800}
.brand small{display:block;font-size:11px;color:#788195;font-weight:500;margin-top:2px}
.iconbtn{width:42px;height:42px;border-radius:12px;background:#f0f3f8;font-size:20px}
.hero{margin:16px;border-radius:24px;padding:24px;background:linear-gradient(135deg,#273c75,#7d5fff);color:#fff;box-shadow:0 10px 30px #263c7533}
.hero h1{margin:0;font-size:28px}
.hero p{margin:8px 0 18px;color:#e8ecff}
.primary{background:#fff;color:#263c75;padding:13px 20px;border-radius:14px;font-weight:800}
.section{padding:0 16px 18px}
.sectiontitle{font-weight:800;font-size:17px;margin:8px 0 12px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.card{background:#fff;border:1px solid #e8ebf1;border-radius:18px;padding:16px 8px;min-height:96px;box-shadow:0 4px 15px #1720330a}
.card b{display:block;font-size:12px;margin-top:8px}
.card .ico{font-size:25px}
.bottomnav{height:68px;background:#fff;border-top:1px solid #e6e9ef;display:flex;align-items:center;justify-content:space-around;flex-shrink:0}
.navitem{background:transparent;color:#687286;font-size:11px;text-align:center}
.navitem span{display:block;font-size:21px;margin-bottom:2px}
.plus{width:52px;height:52px;border-radius:50%;background:#263c75;color:#fff;font-size:28px;margin-top:-22px;box-shadow:0 7px 18px #263c7540}
#setup{display:none;background:#f5f7fb;overflow:auto}
.setuphead{height:62px;background:#fff;display:flex;align-items:center;padding:0 14px;gap:12px;border-bottom:1px solid #e6e9ef}
.setuphead h2{font-size:18px;margin:0}
.back{width:40px;height:40px;border-radius:12px;background:#eef1f6}
.form{padding:18px}
.form label{font-size:12px;color:#667085;font-weight:700;display:block;margin:12px 0 6px}
.row{display:flex;gap:10px}
.input{width:100%;padding:13px;border:1px solid #dfe3ea;border-radius:12px;background:#fff;outline:none}
.presets{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px}
.preset{padding:15px;border-radius:14px;background:#fff;border:1px solid #e5e8ef;text-align:left}
.preset b{display:block}
.create{width:100%;padding:15px;border-radius:14px;background:#263c75;color:#fff;font-weight:800;margin-top:18px}
#editor{display:none;flex-direction:column;background:#e9edf3}
.editortop{height:58px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 9px;border-bottom:1px solid #dfe3ea;flex-shrink:0}
.toolbar{display:flex;gap:6px}
.toolbtn{width:40px;height:40px;border-radius:11px;background:#f0f2f6}
#stage{flex:1;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
#canvas{position:relative;width:1080px;height:1080px;background:#fff;overflow:hidden;box-shadow:0 12px 35px #0002;transform-origin:center center;flex-shrink:0}
.obj{position:absolute;touch-action:none;user-select:none}
.textobj{min-width:80px;min-height:40px;padding:4px;outline:none;white-space:pre-wrap}
.imgobj{object-fit:contain}
.shapeobj{background:#263c75;border-radius:12px}
.obj.selected{outline:2px solid #5b6cff}
.handles{position:absolute;inset:-7px;pointer-events:none;z-index:9999}
.handle{position:absolute;width:14px;height:14px;border-radius:50%;background:#fff;border:2px solid #5b6cff;pointer-events:auto;touch-action:none}
.h-tl{left:0;top:0}.h-tc{left:50%;top:0;transform:translateX(-50%)}
.h-tr{right:0;top:0}.h-ml{left:0;top:50%;transform:translateY(-50%)}
.h-mr{right:0;top:50%;transform:translateY(-50%)}
.h-bl{left:0;bottom:0}.h-bc{left:50%;bottom:0;transform:translateX(-50%)}
.h-br{right:0;bottom:0}
.rotate{left:50%;top:-32px;transform:translateX(-50%);background:#5b6cff}
.bottomtools{height:68px;background:#fff;border-top:1px solid #dfe3ea;display:flex;justify-content:space-around;align-items:center;flex-shrink:0}
.bottomtools button{background:transparent;color:#505b70;font-size:11px}
.bottomtools span{display:block;font-size:22px}
.panel{position:absolute;right:0;top:58px;bottom:68px;width:min(340px,92%);background:#fff;z-index:10000;box-shadow:-8px 0 25px #0002;padding:16px;overflow:auto}
.panel h3{margin:0 0 14px}
.panelrow{display:flex;gap:8px;align-items:center;margin:8px 0}
.smallbtn{padding:9px 11px;background:#eef1f6;border-radius:10px}
.range{width:100%}
.layer{display:flex;align-items:center;gap:7px;padding:10px;border-bottom:1px solid #edf0f4}
.layername{flex:1;font-size:12px}
.layer button{background:#eef1f6;border-radius:7px;padding:5px}
.modal{position:absolute;inset:0;background:#0007;z-index:20000;display:none;align-items:center;justify-content:center;padding:20px}
.modal.show{display:flex}
.modalbox{width:min(430px,100%);max-height:85%;overflow:auto;background:#fff;border-radius:20px;padding:18px}
.modalhead{display:flex;justify-content:space-between;align-items:center}
.modalgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
.modalitem{padding:15px;border-radius:14px;background:#f3f5f9;text-align:left}
#file{display:none}
</style>
</head>

<body>

<section id="home" class="screen">
  <div class="topbar">
    <div class="brand">Urdu Design Studio<small>Design • Edit • Save</small></div>
    <button class="iconbtn" id="settingsBtn">⚙</button>
  </div>

  <div class="hero">
    <h1>Creative Design Made Easy</h1>
    <p>Make Urdu designing easy and creative.</p>
    <button class="primary" id="newBtn">Start Designing</button>
  </div>

  <div class="section">
    <div class="sectiontitle">Quick Tools</div>
    <div class="grid">
      <button class="card" id="homeTemplates"><span class="ico">🖼️</span><b>Templates</b></button>
      <button class="card" id="homeProjects"><span class="ico">📁</span><b>My Designs</b></button>
      <button class="card" id="homeElements"><span class="ico">✨</span><b>Elements</b></button>
      <button class="card" id="homeShapes"><span class="ico">⬢</span><b>Shapes</b></button>
      <button class="card" id="homeFrames"><span class="ico">▣</span><b>Frames</b></button>
      <button class="card" id="homeBackgrounds"><span class="ico">🎨</span><b>Backgrounds</b></button>
      <button class="card" id="homeImport"><span class="ico">📷</span><b>Import Image</b></button>
      <button class="card" id="homeText"><span class="ico">T</span><b>Text</b></button>
      <button class="card" id="homeMore"><span class="ico">⋯</span><b>More Tools</b></button>
    </div>
  </div>

  <div class="bottomnav">
    <button class="navitem" id="navHome"><span>⌂</span>Home</button>
    <button class="navitem" id="navTemplates"><span>▦</span>Templates</button>
    <button class="plus" id="plusBtn">+</button>
    <button class="navitem" id="navProjects"><span>▤</span>Projects</button>
    <button class="navitem" id="navSettings"><span>⚙</span>Settings</button>
  </div>
</section>

<section id="setup" class="screen">
  <div class="setuphead">
    <button class="back" id="back">←</button>
    <h2>New Design</h2>
  </div>
  <div class="form">
    <label>Canvas Width</label>
    <input class="input" id="cw" type="number" value="1080">
    <label>Canvas Height</label>
    <input class="input" id="ch" type="number" value="1080">

    <label>Preset Sizes</label>
    <div class="presets">
      <button class="preset" data-w="1080" data-h="1080"><b>Square</b>1080 × 1080</button>
      <button class="preset" data-w="1080" data-h="1350"><b>Portrait</b>1080 × 1350</button>
      <button class="preset" data-w="1080" data-h="1920"><b>Story</b>1080 × 1920</button>
      <button class="preset" data-w="1920" data-h="1080"><b>Landscape</b>1920 × 1080</button>
      <button class="preset" data-w="1200" data-h="628"><b>Social Post</b>1200 × 628</button>
      <button class="preset" data-w="1280" data-h="720"><b>Thumbnail</b>1280 × 720</button>
    </div>

    <button class="create" id="create">Create Design</button>
  </div>
</section>

<section id="editor" class="screen">
  <div class="editortop">
    <div class="toolbar">
      <button class="toolbtn" id="undo">↶</button>
      <button class="toolbtn" id="redo">↷</button>
    </div>
    <div class="toolbar">
      <button class="toolbtn" id="layersTop">☷</button>
      <button class="toolbtn" id="save">💾</button>
    </div>
  </div>

  <div id="stage">
    <div id="canvas"></div>

    <div class="panel hidden" id="editPanel">
      <h3>Edit Object</h3>
      <div class="panelrow">
        <button class="smallbtn" id="fit">Fit</button>
        <button class="smallbtn" id="center">Center</button>
        <button class="smallbtn" id="rminus">− Rotate</button>
        <button class="smallbtn" id="rplus">+ Rotate</button>
      </div>

      <label>Color</label>
      <input id="color" type="color" value="#263c75">

      <label>Font Size</label>
      <input id="fontSize" class="range" type="range" min="8" max="180" value="40">

      <div class="panelrow">
        <button class="smallbtn" id="bold">Bold</button>
        <button class="smallbtn" id="left">Left</button>
        <button class="smallbtn" id="centerText">Center</button>
        <button class="smallbtn" id="right">Right</button>
      </div>

      <label>Font</label>
      <select class="input" id="font">
        <option value="Arial">Arial</option>
        <option value="Georgia">Georgia</option>
        <option value="Times New Roman">Times New Roman</option>
        <option value="Tahoma">Tahoma</option>
        <option value="serif">Serif</option>
        <option value="sans-serif">Sans Serif</option>
      </select>

      <div class="panelrow">
        <button class="smallbtn" id="dup">Duplicate</button>
        <button class="smallbtn" id="del">Delete</button>
        <button class="smallbtn" id="up">Bring Forward</button>
        <button class="smallbtn" id="down">Send Back</button>
      </div>

      <button class="smallbtn" data-close="editPanel">Close</button>
    </div>

    <div class="panel hidden" id="layerPanel">
      <h3>Layers</h3>
      <div id="layers"></div>
      <button class="smallbtn" data-close="layerPanel">Close</button>
    </div>
  </div>

  <div class="bottomtools">
    <button id="addText"><span>T</span>Text</button>
    <button id="addImage"><span>▧</span>Image</button>
    <button id="addShape"><span>⬢</span>Shape</button>
    <button id="addBg"><span>🎨</span>Background</button>
    <button id="edit"><span>✎</span>Edit</button>
  </div>
</section>

<input type="file" id="file" accept="image/png,image/jpeg,image/jpg">

<div class="modal" id="modal">
  <div class="modalbox">
    <div class="modalhead">
      <h3 id="modalTitle">Tools</h3>
      <button class="iconbtn" id="modalClose">×</button>
    </div>
    <div class="modalgrid" id="modalGrid"></div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);

const home=$('home');
const setup=$('setup');
const editor=$('editor');
const canvas=$('canvas');
const stage=$('stage');

let selected=null;
let history=[];
let future=[];
let designW=1080;
let designH=1080;
let gesture=null;
let fileMode='image';

function snapshot(){
  history.push(JSON.stringify({
    html:canvas.innerHTML,
    w:designW,
    h:designH
  }));
  if(history.length>40) history.shift();
  future=[];
}

function restore(data){
  try{
    const x=JSON.parse(data);
    designW=x.w||1080;
    designH=x.h||1080;
    canvas.innerHTML=x.html||'';
    applyCanvasSize();
    selected=null;
    canvas.querySelectorAll('.obj').forEach(addObjectEvents);
    refresh();
  }catch(e){}
}

function select(o){
  document.querySelectorAll('.obj.selected').forEach(x=>x.classList.remove('selected'));
  selected=o;
  if(o) o.classList.add('selected');
  refresh();
}

function handleMarkup(){
  return `
  <div class="handles">
    <span class="handle h-tl" data-h="tl"></span>
    <span class="handle h-tc" data-h="tc"></span>
    <span class="handle h-tr" data-h="tr"></span>
    <span class="handle h-ml" data-h="ml"></span>
    <span class="handle h-mr" data-h="mr"></span>
    <span class="handle h-bl" data-h="bl"></span>
    <span class="handle h-bc" data-h="bc"></span>
    <span class="handle h-br" data-h="br"></span>
    <span class="handle rotate" data-h="rotate"></span>
  </div>`;
}

function addObjectEvents(o){
  if(!o.classList.contains('obj')) return;

  o.querySelectorAll('.handles').forEach(h=>h.remove());
  o.insertAdjacentHTML('beforeend',handleMarkup());

  o.addEventListener('pointerdown',objectDown);
  o.addEventListener('click',e=>{
    e.stopPropagation();
    select(o);
  });

  o.querySelectorAll('.handle').forEach(h=>{
    h.addEventListener('pointerdown',handleDown);
  });

  if(o.classList.contains('textobj')){
    o.addEventListener('input',()=>{
      if(selected===o) refresh();
    });
  }
}

function make(type){
  snapshot();

  let o;

  if(type==='text'){
    o=document.createElement('div');
    o.className='obj textobj';
    o.textContent='New Text';
    o.contentEditable='true';
    o.style.fontSize='40px';
    o.style.fontWeight='400';
    o.style.color='#172033';
    o.style.fontFamily='Arial';
    o.style.width='300px';
    o.style.height='70px';
  }

  if(type==='image'){
    o=document.createElement('img');
    o.className='obj imgobj';
    o.style.width='260px';
    o.style.height='190px';
    o.style.objectFit='contain';
  }

  if(type==='shape'){
    o=document.createElement('div');
    o.className='obj shapeobj';
    o.style.width='220px';
    o.style.height='180px';
    o.style.background='#263c75';
    o.style.borderRadius='18px';
  }

  if(!o) return null;

  o.dataset.name=type==='text'?'Text':type==='image'?'Image':'Shape';
  o.style.left='40px';
  o.style.top='40px';
  o.style.zIndex='10';

  canvas.appendChild(o);
  addObjectEvents(o);
  select(o);
  refresh();

  return o;
}

function objectDown(e){
  if(e.target.classList.contains('handle')) return;

  e.stopPropagation();
  select(this);

  if(this.dataset.locked==='true') return;

  const r=this.getBoundingClientRect();
  const cr=canvas.getBoundingClientRect();
  const scale=cr.width/designW||1;

  gesture={
    type:'move',
    o:this,
    sx:e.clientX,
    sy:e.clientY,
    l:parseFloat(this.style.left)||0,
    t:parseFloat(this.style.top)||0,
    scale
  };

  this.setPointerCapture?.(e.pointerId);
}

function handleDown(e){
  e.stopPropagation();
  e.preventDefault();

  const h=e.currentTarget;
  const o=h.closest('.obj');
  select(o);

  if(o.dataset.locked==='true') return;

  const cr=canvas.getBoundingClientRect();
  const scale=cr.width/designW||1;

  const l=parseFloat(o.style.left)||0;
  const t=parseFloat(o.style.top)||0;
  const w=o.offsetWidth;
  const hgt=o.offsetHeight;

  if(h.dataset.h==='rotate'){
    gesture={
      type:'rotate',
      o,
      sx:e.clientX,
      sy:e.clientY,
      startRot:parseFloat(o.dataset.rot||'0')
    };
  }else{
    gesture={
      type:'resize',
      o,
      handle:h.dataset.h,
      sx:e.clientX,
      sy:e.clientY,
      l,t,w,h:hgt,
      scale
    };
  }

  o.setPointerCapture?.(e.pointerId);
}

window.addEventListener('pointermove',e=>{
  if(!gesture) return;

  const g=gesture;
  const o=g.o;

  if(g.type==='move'){
    const dx=(e.clientX-g.sx)/g.scale;
    const dy=(e.clientY-g.sy)/g.scale;

    o.style.left=Math.round(g.l+dx)+'px';
    o.style.top=Math.round(g.t+dy)+'px';
  }

  if(g.type==='rotate'){
    const rect=o.getBoundingClientRect();
    const cx=rect.left+rect.width/2;
    const cy=rect.top+rect.height/2;

    const a=Math.atan2(e.clientY-cy,e.clientX-cx)*180/Math.PI;
    const a0=Math.atan2(g.sy-cy,g.sx-cx)*180/Math.PI;

    let rot=g.startRot+(a-a0);
    o.dataset.rot=rot;
    o.style.transform='rotate('+rot+'deg)';
  }

  if(g.type==='resize'){
    const dx=(e.clientX-g.sx)/g.scale;
    const dy=(e.clientY-g.sy)/g.scale;

    let l=g.l,t=g.t,w=g.w,h=g.h;
    const min=30;

    if(g.handle.includes('l')){
      l=g.l+dx;
      w=g.w-dx;
    }

    if(g.handle.includes('r')){
      w=g.w+dx;
    }

    if(g.handle.includes('t')){
      t=g.t+dy;
      h=g.h-dy;
    }

    if(g.handle.includes('b')){
      h=g.h+dy;
    }

    if(w<min) w=min;
    if(h<min) h=min;

    o.style.left=Math.round(l)+'px';
    o.style.top=Math.round(t)+'px';
    o.style.width=Math.round(w)+'px';
    o.style.height=Math.round(h)+'px';
  }

  refresh();
});

window.addEventListener('pointerup',()=>{
  if(gesture){
    snapshot();
    gesture=null;
    refresh();
  }
});

canvas.addEventListener('pointerdown',e=>{
  if(e.target===canvas) select(null);
});

function refresh(){
  updateLayers();

  if(selected){
    $('editPanel')?.classList.remove('hidden');

    const color=selected.style.color||selected.style.backgroundColor;
    if(color && color.startsWith('#')) $('color').value=color;

    const fs=parseInt(selected.style.fontSize||40);
    if(fs) $('fontSize').value=Math.min(180,Math.max(8,fs));

    $('font').value=selected.style.fontFamily||'Arial';
  }
}

function updateLayers(){
  const box=$('layers');
  if(!box) return;

  box.innerHTML='';

  [...canvas.querySelectorAll('.obj')].reverse().forEach((o,i)=>{
    const row=document.createElement('div');
    row.className='layer';

    const name=document.createElement('div');
    name.className='layername';
    name.textContent=o.dataset.name||('Object '+(i+1));

    const eye=document.createElement('button');
    eye.textContent=o.style.display==='none'?'○':'●';
    eye.onclick=e=>{
      e.stopPropagation();
      o.style.display=o.style.display==='none'?'block':'none';
      snapshot();
      updateLayers();
    };

    const lock=document.createElement('button');
    lock.textContent=o.dataset.locked==='true'?'🔒':'🔓';
    lock.onclick=e=>{
      e.stopPropagation();
      o.dataset.locked=o.dataset.locked==='true'?'false':'true';
      snapshot();
      updateLayers();
    };

    const up=document.createElement('button');
    up.textContent='↑';
    up.onclick=e=>{
      e.stopPropagation();
      o.style.zIndex=(parseInt(o.style.zIndex||1)+1);
      snapshot();
      updateLayers();
    };

    const down=document.createElement('button');
    down.textContent='↓';
    down.onclick=e=>{
      e.stopPropagation();
      o.style.zIndex=Math.max(1,parseInt(o.style.zIndex||1)-1);
      snapshot();
      updateLayers();
    };

    row.append(name,eye,lock,up,down);

    row.onclick=()=>{
      select(o);
    };

    box.appendChild(row);
  });
}

function applyCanvasSize(){
  canvas.style.width=designW+'px';
  canvas.style.height=designH+'px';

  const sw=(stage.clientWidth-30)/designW;
  const sh=(stage.clientHeight-30)/designH;
  const scale=Math.min(sw,sh);

  canvas.style.transform='scale('+Math.max(.05,scale)+')';
}

window.addEventListener('resize',applyCanvasSize);

function showHome(){
  home.style.display='flex';
  setup.style.display='none';
  editor.style.display='none';
}

function openSetup(){
  home.style.display='none';
  setup.style.display='block';
  editor.style.display='none';
}

function openEditor(){
  home.style.display='none';
  setup.style.display='none';
  editor.style.display='flex';
  applyCanvasSize();
}

function closePanels(){
  $('editPanel')?.classList.add('hidden');
  $('layerPanel')?.classList.add('hidden');
}

function showModal(title,items){
  $('modalTitle').textContent=title;
  const grid=$('modalGrid');
  grid.innerHTML='';

  items.forEach(item=>{
    const b=document.createElement('button');
    b.className='modalitem';
    b.innerHTML='<b>'+item.title+'</b><br><small>'+item.text+'</small>';
    b.onclick=()=>{
      $('modal').classList.remove('show');
      if(item.action) item.action();
    };
    grid.appendChild(b);
  });

  $('modal').classList.add('show');
}

$('newBtn').onclick=openSetup;
$('plusBtn').onclick=openSetup;
$('back').onclick=showHome;
$('navHome').onclick=showHome;

$('settingsBtn').onclick=()=>{
  showModal('Settings',[
    {title:'Canvas',text:'Create and edit custom design sizes.'},
    {title:'Storage',text:'Projects are saved locally on this device.'},
    {title:'About',text:'Urdu Design Studio — mobile design editor.'}
  ]);
};

$('navSettings').onclick=$('settingsBtn').onclick;

$('navTemplates').onclick=()=>{
  showModal('Templates',[
    {title:'Urdu Poster',text:'Start a square Urdu poster.',action:()=>{$('cw').value=1080;$('ch').value=1080;openSetup()}},
    {title:'Story',text:'Vertical social story.',action:()=>{$('cw').value=1080;$('ch').value=1920;openSetup()}},
    {title:'Thumbnail',text:'YouTube thumbnail size.',action:()=>{$('cw').value=1280;$('ch').value=720;openSetup()}},
    {title:'Business',text:'Business advertisement canvas.',action:()=>{$('cw').value=1200;$('ch').value=628;openSetup()}}
  ]);
};

$('homeTemplates').onclick=$('navTemplates').onclick;

$('homeProjects').onclick=()=>{
  const saved=localStorage.getItem('UDS_PROJECT');

  if(!saved){
    showModal('My Designs',[
      {title:'No Project',text:'No saved design was found on this device.'}
    ]);
    return;
  }

  showModal('My Designs',[
    {title:'Open Last Design',text:'Open the locally saved project.',action:()=>{
      restore(saved);
      openEditor();
    }},
    {title:'Delete Saved',text:'Remove the locally saved project.',action:()=>{
      localStorage.removeItem('UDS_PROJECT');
    }}
  ]);
};

$('navProjects').onclick=$('homeProjects').onclick;

$('homeElements').onclick=()=>{
  showModal('Design Elements',[
    {title:'Stars',text:'Decorative star elements.',action:()=>{openSetup()}},
    {title:'Hearts',text:'Decorative heart elements.',action:()=>{openSetup()}},
    {title:'Lines',text:'Lines and decorative elements.',action:()=>{openSetup()}},
    {title:'Islamic',text:'Islamic design elements.',action:()=>{openSetup()}}
  ]);
};

$('homeShapes').onclick=()=>{
  showModal('Shapes',[
    {title:'Rectangle',text:'Add a basic shape.',action:()=>{openSetup()}},
    {title:'Rounded Shape',text:'Rounded editable shape.',action:()=>{openSetup()}},
    {title:'Circle',text:'Circle design element.',action:()=>{openSetup()}}
  ]);
};

$('homeFrames').onclick=()=>{
  showModal('Frames',[
    {title:'Photo Frame',text:'Prepare a frame-based design.',action:openSetup},
    {title:'Border',text:'Create a bordered canvas.',action:openSetup}
  ]);
};

$('homeBackgrounds').onclick=()=>{
  showModal('Backgrounds',[
    {title:'White',text:'Clean white background.',action:()=>{openSetup()}},
    {title:'Blue',text:'Blue design background.',action:()=>{openSetup()}},
    {title:'Gradient',text:'Gradient background tools.',action:()=>{openSetup()}}
  ]);
};

$('homeImport').onclick=()=>{
  fileMode='image';
  $('file').click();
};

$('homeText').onclick=()=>{
  openSetup();
};

$('homeMore').onclick=()=>{
  showModal('More Tools',[
    {title:'Layers',text:'Manage object layers.',action:openSetup},
    {title:'Save Project',text:'Save your editable design locally.',action:()=>{saveProject()}},
    {title:'Undo / Redo',text:'Edit history is available inside editor.',action:openSetup},
    {title:'Import Image',text:'Import PNG/JPG images.',action:()=>{$('file').click()}}
  ]);
};

document.querySelectorAll('.preset').forEach(p=>{
  p.onclick=()=>{
    $('cw').value=p.dataset.w;
    $('ch').value=p.dataset.h;
  };
});

$('create').onclick=()=>{
  const w=parseInt($('cw').value)||1080;
  const h=parseInt($('ch').value)||1080;

  designW=Math.max(100,Math.min(5000,w));
  designH=Math.max(100,Math.min(5000,h));

  canvas.innerHTML='';
  selected=null;
  history=[];
  future=[];

  canvas.style.background='#fff';

  openEditor();
  snapshot();
};

$('undo').onclick=()=>{
  if(history.length<=1) return;

  const current=history.pop();
  future.push(current);

  const previous=history[history.length-1];
  restore(previous);
};

$('redo').onclick=()=>{
  if(!future.length) return;

  const next=future.pop();
  history.push(next);
  restore(next);
};

function saveProject(){
  const data=JSON.stringify({
    html:canvas.innerHTML,
    w:designW,
    h:designH,
    savedAt:Date.now()
  });

  localStorage.setItem('UDS_PROJECT',data);

  showModal('Project Saved',[
    {title:'Saved',text:'Your editable project is saved on this device.'}
  ]);
}

$('save').onclick=saveProject;

$('layersTop').onclick=()=>{
  $('editPanel').classList.add('hidden');
  $('layerPanel').classList.remove('hidden');
  updateLayers();
};

$('addText').onclick=()=>{
  const o=make('text');
  if(o){
    o.focus();
    try{
      const range=document.createRange();
      range.selectNodeContents(o);
      const sel=window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    }catch(e){}
  }
};

$('addShape').onclick=()=>{
  make('shape');
};

$('addImage').onclick=()=>{
  fileMode='image';
  $('file').click();
};

$('addBg').onclick=()=>{
  fileMode='background';
  $('file').click();
};

$('edit').onclick=()=>{
  if(!selected){
    showModal('Edit',[
      {title:'Select Object',text:'Tap an image, text or shape first.'}
    ]);
    return;
  }

  $('layerPanel').classList.add('hidden');
  $('editPanel').classList.remove('hidden');
  refresh();
};

$('fit').onclick=()=>{
  if(!selected) return;

  const pad=20;
  selected.style.left=pad+'px';
  selected.style.top=pad+'px';
  selected.style.width=Math.max(30,designW-pad*2)+'px';
  selected.style.height=Math.max(30,designH-pad*2)+'px';

  snapshot();
  refresh();
};

$('center').onclick=()=>{
  if(!selected) return;

  const w=selected.offsetWidth;
  const h=selected.offsetHeight;

  selected.style.left=Math.round((designW-w)/2)+'px';
  selected.style.top=Math.round((designH-h)/2)+'px';

  snapshot();
  refresh();
};

$('rminus').onclick=()=>{
  if(!selected) return;

  const r=parseFloat(selected.dataset.rot||0)-15;
  selected.dataset.rot=r;
  selected.style.transform='rotate('+r+'deg)';
  snapshot();
};

$('rplus').onclick=()=>{
  if(!selected) return;

  const r=parseFloat(selected.dataset.rot||0)+15;
  selected.dataset.rot=r;
  selected.style.transform='rotate('+r+'deg)';
  snapshot();
};

$('color').oninput=e=>{
  if(!selected) return;

  if(selected.classList.contains('textobj')){
    selected.style.color=e.target.value;
  }else{
    selected.style.backgroundColor=e.target.value;
  }
};

$('color').onchange=()=>{
  if(selected) snapshot();
};

$('fontSize').oninput=e=>{
  if(!selected) return;

  selected.style.fontSize=e.target.value+'px';
};

$('fontSize').onchange=()=>{
  if(selected) snapshot();
};

$('bold').onclick=()=>{
  if(!selected) return;

  selected.style.fontWeight=
    selected.style.fontWeight==='700'?'400':'700';

  snapshot();
};

$('left').onclick=()=>{
  if(!selected) return;

  selected.style.textAlign='left';
  snapshot();
};

$('centerText').onclick=()=>{
  if(!selected) return;

  selected.style.textAlign='center';
  snapshot();
};

$('right').onclick=()=>{
  if(!selected) return;

  selected.style.textAlign='right';
  snapshot();
};

$('font').onchange=e=>{
  if(!selected) return;

  selected.style.fontFamily=e.target.value;
  snapshot();
};

$('dup').onclick=()=>{
  if(!selected) return;

  snapshot();

  const copy=selected.cloneNode(true);
  copy.querySelectorAll('.handles').forEach(h=>h.remove());

  copy.style.left=(parseFloat(selected.style.left||0)+30)+'px';
  copy.style.top=(parseFloat(selected.style.top||0)+30)+'px';
  copy.dataset.name=(selected.dataset.name||'Object')+' Copy';
  copy.dataset.locked='false';

  canvas.appendChild(copy);
  addObjectEvents(copy);
  select(copy);
};

$('del').onclick=()=>{
  if(!selected) return;

  snapshot();
  selected.remove();
  selected=null;
  refresh();
};

$('up').onclick=()=>{
  if(!selected) return;

  selected.style.zIndex=parseInt(selected.style.zIndex||1)+1;
  snapshot();
  refresh();
};

$('down').onclick=()=>{
  if(!selected) return;

  selected.style.zIndex=Math.max(1,parseInt(selected.style.zIndex||1)-1);
  snapshot();
  refresh();
};

document.querySelectorAll('[data-close]').forEach(b=>{
  b.onclick=()=>{
    $(b.dataset.close).classList.add('hidden');
  };
});

$('modalClose').onclick=()=>{
  $('modal').classList.remove('show');
};

$('modal').addEventListener('click',e=>{
  if(e.target===$('modal')){
    $('modal').classList.remove('show');
  }
});

$('file').onchange=e=>{
  const f=e.target.files?.[0];
  if(!f) return;

  const reader=new FileReader();

  reader.onload=ev=>{
    if(fileMode==='background'){
      snapshot();
      canvas.style.backgroundImage='url("'+ev.target.result+'")';
      canvas.style.backgroundSize='cover';
      canvas.style.backgroundPosition='center';
      canvas.dataset.background='image';
      refresh();
    }else{
      const o=make('image');

      if(o){
        o.src=ev.target.result;
        o.dataset.name=f.name||'Image';
        o.style.width=Math.min(500,designW-80)+'px';
        o.style.height=Math.min(400,designH-80)+'px';
        o.style.objectFit='contain';
        o.style.left='40px';
        o.style.top='40px';
        snapshot();
        refresh();
      }
    }

    e.target.value='';
  };

  reader.readAsDataURL(f);
};

document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    closePanels();
    $('modal').classList.remove('show');
  }

  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){
    e.preventDefault();
    $('undo').click();
  }

  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'){
    e.preventDefault();
    $('redo').click();
  }

  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){
    e.preventDefault();
    saveProject();
  }

  if(e.key==='Delete' && selected && document.activeElement!==selected){
    $('del').click();
  }
});

applyCanvasSize();
refresh();
</script>
</body>
</html>
