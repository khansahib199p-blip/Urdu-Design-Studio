<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Urdu Design Studio</title>

<style>
*{box-sizing:border-box}

html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
font-family:Arial,"Noto Nastaliq Urdu","Noto Naskh Arabic",sans-serif;
background:#0b0d18;
color:#fff;
}

button,input,textarea,select{font-family:inherit}

.app{
height:100vh;
display:flex;
flex-direction:column;
background:
radial-gradient(circle at 50% -20%,#5e2aa0 0,#17152d 38%,#090b15 100%);
}

/* TOP BAR */

.topbar{
height:64px;
min-height:64px;
display:flex;
align-items:center;
justify-content:space-between;
padding:7px 10px;
background:rgba(30,20,55,.92);
border-bottom:1px solid #ffffff18;
box-shadow:0 5px 20px #0008;
}

.brand{
display:flex;
align-items:center;
gap:8px;
font-size:19px;
font-weight:800;
white-space:nowrap;
}

.brandIcon{
width:42px;
height:42px;
border-radius:13px;
display:flex;
align-items:center;
justify-content:center;
background:linear-gradient(135deg,#8d4dff,#d92cff);
box-shadow:0 5px 18px #922cff55;
font-size:23px;
}

.topTools{
display:flex;
gap:6px;
direction:ltr;
}

.topBtn{
width:43px;
height:43px;
border:1px solid #ffffff12;
border-radius:13px;
background:#ffffff0d;
color:#fff;
font-size:19px;
}

.topBtn:active{
transform:scale(.92);
background:#8b3dff;
}

/* WORK AREA */

.work{
flex:1;
display:flex;
min-height:0;
}

.side{
width:62px;
min-width:62px;
background:#121425;
border-left:1px solid #ffffff0c;
display:flex;
flex-direction:column;
align-items:center;
padding:8px 6px;
gap:7px;
}

.sideBtn{
width:49px;
height:49px;
border:1px solid #ffffff0d;
border-radius:15px;
background:#1e2136;
color:#fff;
font-size:20px;
}

.sideBtn.active{
background:linear-gradient(145deg,#743cff,#b72cff);
box-shadow:0 6px 18px #7c32ff55;
}

/* CANVAS */

.stage{
flex:1;
min-width:0;
position:relative;
overflow:auto;
display:flex;
align-items:center;
justify-content:center;
padding:18px;
}

.canvas{
position:relative;
width:340px;
height:500px;
flex:none;
background:#fff;
box-shadow:0 15px 45px #000b;
overflow:hidden;
border-radius:5px;
}

.grid{
position:absolute;
inset:0;
background-image:
linear-gradient(#00000008 1px,transparent 1px),
linear-gradient(90deg,#00000008 1px,transparent 1px);
background-size:20px 20px;
pointer-events:none;
}

.empty{
position:absolute;
inset:0;
display:flex;
align-items:center;
justify-content:center;
color:#aaa;
font-size:20px;
pointer-events:none;
}

/* OBJECT */

.obj{
position:absolute;
touch-action:none;
user-select:none;
cursor:move;
}

.obj.selected{
outline:2px solid #7c3cff;
outline-offset:3px;
}

.textObj{
padding:5px 10px;
min-width:60px;
min-height:40px;
font-size:30px;
color:#171717;
text-align:center;
direction:rtl;
white-space:pre-wrap;
line-height:1.35;
background:transparent;
}

.textObj:focus{
outline:2px solid #7c3cff;
}

.rect{
width:120px;
height:100px;
background:#a477ff44;
border:3px solid #713bff;
border-radius:12px;
}

.circle{
width:120px;
height:120px;
background:#ff5ca844;
border:3px solid #ff4e9b;
border-radius:50%;
}

.line{
width:160px;
height:5px;
background:#673bff;
border-radius:5px;
}

/* HANDLES */

.handle{
position:absolute;
width:17px;
height:17px;
border-radius:50%;
background:#7c3cff;
border:3px solid white;
box-shadow:0 2px 7px #0008;
z-index:20;
display:none;
}

.selected .handle{
display:block;
}

.resize{
right:-10px;
bottom:-10px;
cursor:nwse-resize;
}

.rotate{
left:50%;
top:-29px;
transform:translateX(-50%);
cursor:grab;
}

/* BOTTOM */

.bottom{
background:rgba(18,20,37,.98);
border-top:1px solid #ffffff12;
padding:8px;
}

.toolGrid{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:7px;
}

.tool{
height:62px;
border:1px solid #ffffff0c;
border-radius:16px;
background:linear-gradient(145deg,#24273e,#191b2e);
color:#fff;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
gap:3px;
font-size:12px;
box-shadow:0 4px 12px #0004;
}

.tool .ico{
font-size:22px;
line-height:22px;
}

.tool:active{
transform:scale(.94);
background:linear-gradient(145deg,#773dff,#b92cff);
}

/* PANEL */

.panel{
position:absolute;
left:8px;
right:8px;
bottom:8px;
z-index:50;
background:rgba(25,27,45,.98);
border:1px solid #ffffff18;
border-radius:20px;
padding:14px;
box-shadow:0 15px 45px #000c;
display:none;
max-height:310px;
overflow:auto;
}

.panel.show{
display:block;
}

.panelTitle{
font-size:17px;
font-weight:bold;
margin-bottom:10px;
display:flex;
justify-content:space-between;
}

.close{
border:0;
background:#ffffff12;
color:#fff;
border-radius:9px;
width:32px;
height:32px;
}

.row{
display:flex;
align-items:center;
gap:8px;
margin:8px 0;
}

.row label{
width:72px;
font-size:13px;
color:#ddd;
}

.row input[type="range"]{
flex:1;
accent-color:#9a4cff;
}

.color{
width:48px!important;
height:38px;
padding:2px;
border:0;
background:none;
}

select{
flex:1;
padding:9px;
border-radius:10px;
background:#10121f;
color:#fff;
border:1px solid #ffffff18;
}

.mini{
display:grid;
grid-template-columns:1fr 1fr;
gap:7px;
}

.mini button{
padding:9px;
border:0;
border-radius:10px;
background:#2b2e46;
color:#fff;
}

.modal{
position:fixed;
inset:0;
background:#000b;
z-index:100;
display:none;
align-items:center;
justify-content:center;
padding:20px;
}

.modal.show{
display:flex;
}

.modalBox{
width:100%;
max-width:390px;
background:#202338;
border:1px solid #ffffff18;
border-radius:22px;
padding:18px;
box-shadow:0 20px 60px #000;
}

.modalTitle{
font-size:19px;
font-weight:bold;
margin-bottom:12px;
}

.textArea{
width:100%;
min-height:100px;
resize:none;
background:#10121e;
border:1px solid #ffffff20;
border-radius:13px;
padding:12px;
color:#fff;
font-size:21px;
direction:rtl;
}

.modalBtns{
display:flex;
gap:8px;
margin-top:12px;
}

.modalBtns button{
flex:1;
padding:12px;
border:0;
border-radius:12px;
color:#fff;
background:#35384f;
}

.modalBtns .ok{
background:linear-gradient(135deg,#753cff,#bd2cff);
}

/* SMALL SCREEN */

@media(max-width:500px){
.brand{font-size:16px}
.side{display:none}
.stage{padding:12px}
.canvas{width:330px;height:480px}
.tool{height:58px}
}
</style>
</head>

<body>

<div class="app">

<!-- TOP -->

<div class="topbar">

<div class="brand">
<div class="brandIcon">🎨</div>
<div>اردو ڈیزائن اسٹوڈیو</div>
</div>

<div class="topTools">
<button class="topBtn" onclick="undo()">↶</button>
<button class="topBtn" onclick="redo()">↷</button>
<button class="topBtn" onclick="saveDesign()">💾</button>
</div>

</div>

<!-- WORK -->

<div class="work">

<div class="side">

<button class="sideBtn active" onclick="openTools()">🛠️</button>
<button class="sideBtn" onclick="togglePanel()">⚙️</button>
<button class="sideBtn" onclick="deleteSelected()">🗑️</button>

</div>

<div class="stage">

<div class="canvas" id="canvas">

<div class="grid"></div>

<div class="empty" id="empty">
اپنا ڈیزائن یہاں بنائیں
</div>

</div>

<!-- EDIT PANEL -->

<div class="panel" id="panel">

<div class="panelTitle">
<span>✦ آبجیکٹ کی ترمیم</span>
<button class="close" onclick="togglePanel()">×</button>
</div>

<div class="row">
<label>رنگ</label>
<input class="color" id="color" type="color" value="#713bff">
</div>

<div class="row">
<label>سائز</label>
<input id="size" type="range" min="10" max="100" value="30">
<span id="sizeVal">30</span>
</div>

<div class="row">
<label>فونٹ</label>
<select id="font">
<option>Arial</option>
<option>Noto Nastaliq Urdu</option>
<option>Noto Naskh Arabic</option>
<option>serif</option>
<option>sans-serif</option>
</select>
</div>

<div class="row">
<label>موٹائی</label>
<select id="weight">
<option value="400">Normal</option>
<option value="600">Semi Bold</option>
<option value="700">Bold</option>
</select>
</div>

<div class="row">
<label>گولائی</label>
<input id="radius" type="range" min="0" max="100" value="0">
<span id="radiusVal">0</span>
</div>

<div class="mini">
<button onclick="duplicate()">📋 کاپی</button>
<button onclick="deleteSelected()">🗑 حذف</button>
<button onclick="front()">⬆️ اوپر</button>
<button onclick="back()">⬇️ نیچے</button>
</div>

</div>

</div>

</div>

<!-- TOOLS -->

<div class="bottom">

<div class="toolGrid">

<button class="tool" onclick="addText()">
<span class="ico">📝</span>
متن
</button>

<button class="tool" onclick="addRect()">
<span class="ico">▣</span>
مربع
</button>

<button class="tool" onclick="addCircle()">
<span class="ico">●</span>
دائرہ
</button>

<button class="tool" onclick="addLine()">
<span class="ico">━</span>
لائن
</button>

<button class="tool" onclick="pickImage()">
<span class="ico">▧</span>
تصویر
</button>

<button class="tool" onclick="togglePanel()">
<span class="ico">⚙</span>
ترمیم
</button>

<button class="tool" onclick="duplicate()">
<span class="ico">⧉</span>
کاپی
</button>

<button class="tool" onclick="deleteSelected()">
<span class="ico">⌫</span>
حذف
</button>

<button class="tool" onclick="front()">
<span class="ico">↑</span>
اوپر
</button>

<button class="tool" onclick="back()">
<span class="ico">↓</span>
نیچے
</button>

</div>

</div>

</div>

<input id="imageInput" type="file" accept="image/*" hidden>

<!-- TEXT MODAL -->

<div class="modal" id="textModal">

<div class="modalBox">

<div class="modalTitle">
📝 نیا اردو متن
</div>

<textarea
id="newText"
class="textArea"
placeholder="اپنا اردو متن یہاں لکھیں..."
></textarea>

<div class="modalBtns">

<button onclick="closeText()">منسوخ</button>

<button class="ok" onclick="createText()">شامل کریں</button>

</div>

</div>

</div>

<script>
(function(){

let canvas=document.getElementById("canvas");
let selected=null;
let undoStack=[];
let redoStack=[];
let moving=null;
let resizing=null;

function saveState(){
    undoStack.push(canvas.innerHTML);
    if(undoStack.length>30) undoStack.shift();
    redoStack=[];
}

function select(o){
    document.querySelectorAll(".obj").forEach(x=>x.classList.remove("selected"));
    selected=o;
    if(o) o.classList.add("selected");
}

function makeObject(type){
    let o=document.createElement("div");

    o.className="obj "+type;
    o.style.position="absolute";
    o.style.left="90px";
    o.style.top="170px";
    o.style.zIndex="10";

    if(type==="textObj"){
        o.innerText="نیا اردو متن";
        o.contentEditable="true";
        o.style.fontSize="30px";
        o.style.color="#222";
        o.style.background="transparent";
        o.style.padding="8px";
        o.style.minWidth="100px";
        o.style.direction="rtl";
    }

    if(type==="rect"){
        o.style.width="130px";
        o.style.height="100px";
        o.style.background="#713bff44";
        o.style.border="3px solid #713bff";
        o.style.borderRadius="10px";
    }

    if(type==="circle"){
        o.style.width="120px";
        o.style.height="120px";
        o.style.background="#ff4e9b44";
        o.style.border="3px solid #ff4e9b";
        o.style.borderRadius="50%";
    }

    if(type==="line"){
        o.style.width="170px";
        o.style.height="6px";
        o.style.background="#713bff";
        o.style.borderRadius="5px";
    }

    canvas.appendChild(o);
    addControls(o);
    select(o);
    saveState();

    return o;
}

function addControls(o){

    let resize=document.createElement("div");
    resize.className="handle resize";
    o.appendChild(resize);

    o.addEventListener("pointerdown",function(e){

        if(e.target===resize) return;

        e.stopPropagation();
        select(o);

        moving={
            o:o,
            x:e.clientX,
            y:e.clientY,
            left:parseFloat(o.style.left)||0,
            top:parseFloat(o.style.top)||0
        };

        o.setPointerCapture(e.pointerId);
    });

    o.addEventListener("pointermove",function(e){

        if(!moving || moving.o!==o) return;

        let nx=moving.left+(e.clientX-moving.x);
        let ny=moving.top+(e.clientY-moving.y);

        o.style.left=Math.max(0,nx)+"px";
        o.style.top=Math.max(0,ny)+"px";
    });

    o.addEventListener("pointerup",function(){

        if(moving){
            moving=null;
            saveState();
        }
    });

    resize.addEventListener("pointerdown",function(e){

        e.stopPropagation();

        resizing={
            o:o,
            x:e.clientX,
            y:e.clientY,
            w:o.offsetWidth,
            h:o.offsetHeight
        };
    });

    resize.addEventListener("pointermove",function(e){

        if(!resizing || resizing.o!==o) return;

        let w=Math.max(40,
            resizing.w+(e.clientX-resizing.x));

        let h=Math.max(30,
            resizing.h+(e.clientY-resizing.y));

        o.style.width=w+"px";
        o.style.height=h+"px";
    });

    resize.addEventListener("pointerup",function(){

        if(resizing){
            resizing=null;
            saveState();
        }
    });

    o.addEventListener("click",function(e){
        e.stopPropagation();
        select(o);
    });
}


/* TEXT */

window.addText=function(){

    let modal=document.getElementById("textModal");

    if(modal){
        modal.classList.add("show");

        let box=document.getElementById("newText");

        if(box){
            box.value="";
            setTimeout(function(){
                box.focus();
            },300);
        }
    }else{
        let text=prompt("اپنا اردو متن لکھیں","نیا اردو متن");

        if(text){
            let o=makeObject("textObj");
            o.innerText=text;
        }
    }
};

window.closeText=function(){

    let modal=document.getElementById("textModal");

    if(modal) modal.classList.remove("show");
};

window.createText=function(){

    let box=document.getElementById("newText");

    let text=box ? box.value.trim() : "";

    if(!text) text="نیا اردو متن";

    let o=makeObject("textObj");

    o.innerText=text;

    closeText();

    o.focus();
};


/* SHAPES */

window.addRect=function(){
    makeObject("rect");
};

window.addCircle=function(){
    makeObject("circle");
};

window.addLine=function(){
    makeObject("line");
};


/* IMAGE */

window.pickImage=function(){

    let input=document.getElementById("imageInput");

    if(input) input.click();
};

let imageInput=document.getElementById("imageInput");

if(imageInput){

    imageInput.addEventListener("change",function(){

        let file=this.files[0];

        if(!file) return;

        let reader=new FileReader();

        reader.onload=function(e){

            let img=document.createElement("img");

            img.className="obj imageObj";
            img.src=e.target.result;

            img.style.position="absolute";
            img.style.left="70px";
            img.style.top="120px";
            img.style.width="190px";
            img.style.height="auto";
            img.style.zIndex="10";
            img.style.objectFit="contain";

            canvas.appendChild(img);

            addControls(img);
            select(img);
            saveState();
        };

        reader.readAsDataURL(file);
        this.value="";
    });
}


/* DELETE */

window.deleteSelected=function(){

    if(!selected){
        alert("پہلے کسی چیز کو منتخب کریں");
        return;
    }

    selected.remove();
    selected=null;

    saveState();
};


/* COPY */

window.duplicate=function(){

    if(!selected){
        alert("پہلے کسی چیز کو منتخب کریں");
        return;
    }

    let copy=selected.cloneNode(true);

    copy.style.left=
        ((parseFloat(selected.style.left)||0)+25)+"px";

    copy.style.top=
        ((parseFloat(selected.style.top)||0)+25)+"px";

    copy.dataset.ready="";

    canvas.appendChild(copy);

    addControls(copy);
    select(copy);

    saveState();
};


/* LAYERS */

window.front=function(){

    if(!selected) return;

    selected.style.zIndex="999";
    saveState();
};

window.back=function(){

    if(!selected) return;

    selected.style.zIndex="1";
    saveState();
};


/* PANEL */

window.togglePanel=function(){

    let p=document.getElementById("panel");

    if(!selected){

        alert("پہلے کسی متن یا شکل کو منتخب کریں");
        return;
    }

    if(p) p.classList.toggle("show");
};


/* UNDO */

window.undo=function(){

    if(undoStack.length===0) return;

    redoStack.push(canvas.innerHTML);

    let old=undoStack.pop();

    canvas.innerHTML=old;

    selected=null;

    canvas.querySelectorAll(".obj").forEach(function(o){
        addControls(o);
    });
};


/* REDO */

window.redo=function(){

    if(redoStack.length===0) return;

    undoStack.push(canvas.innerHTML);

    let next=redoStack.pop();

    canvas.innerHTML=next;

    selected=null;

    canvas.querySelectorAll(".obj").forEach(function(o){
        addControls(o);
    });
};


/* SAVE */

window.saveDesign=function(){

    localStorage.setItem(
        "UDS_DESIGN",
        canvas.innerHTML
    );

    alert("ڈیزائن محفوظ ہوگیا ✓");
};


/* CANVAS */

canvas.addEventListener("click",function(e){

    if(e.target===canvas){
        select(null);
    }
});


/* COLOR */

let color=document.getElementById("color");

if(color){

    color.addEventListener("input",function(){

        if(!selected) return;

        if(selected.classList.contains("textObj")){
            selected.style.color=this.value;
        }else{
            selected.style.borderColor=this.value;
        }
    });

    color.addEventListener("change",saveState);
}


/* FONT SIZE */

let size=document.getElementById("size");

if(size){

    size.addEventListener("input",function(){

        if(!selected) return;

        selected.style.fontSize=this.value+"px";

        let v=document.getElementById("sizeVal");

        if(v) v.innerText=this.value;
    });

    size.addEventListener("change",saveState);
}


/* FONT */

let font=document.getElementById("font");

if(font){

    font.addEventListener("change",function(){

        if(!selected) return;

        selected.style.fontFamily=this.value;

        saveState();
    });
}


/* WEIGHT */

let weight=document.getElementById("weight");

if(weight){

    weight.addEventListener("change",function(){

        if(!selected) return;

        selected.style.fontWeight=this.value;

        saveState();
    });
}


/* RADIUS */

let radius=document.getElementById("radius");

if(radius){

    radius.addEventListener("input",function(){

        if(!selected) return;

        selected.style.borderRadius=this.value+"px";

        let v=document.getElementById("radiusVal");

        if(v) v.innerText=this.value;
    });

    radius.addEventListener("change",saveState);
}


/* START */

canvas.querySelectorAll(".obj").forEach(function(o){
    addControls(o);
});

saveState();

})();
</script>
